<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudyMatch - Início</title>
<style>body{ 
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f0ff;}
header{
    background:#6d28d9;
    color:white;
    padding:20px;
    text-align:center;}
.container{
    padding:30px;}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;}
.card{
    background:white; 
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;}
.card:hover{
    transform:translateY(-5px);}
.card h3{
    color:#6d28d9;}
.card p{
    color:#555;}
.perfil{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;}
button{
    background:#6d28d9;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;}
    </style>
</head><body>
<header> 
    <h1>StudyMatch</h1></header>
<div class="container">
    <div class="perfil">
        <h2>Olá! 

        </h2>
        <p>Pronta para alcançar suas metas hoje?</p>
    </div>
    <div class="cards">
        <div class="card">
            <h3> Encontrar Grupo</h3> 
            <p>Encontre estudantes com os mesmos objetivos.</p>
            <button>Entrar</button>
        </div>
        <div class="card">
            <h3> Minhas Metas</h3>
            <p>Acompanhe seu progresso semanal.</p>
            <button>Ver Metas</button>
        </div>
        <div class="card">
            <h3> Chat</h3>
            <p>Converse com seus colegas de estudo.</p>
            <button>Abrir Chat</button>
        </div>
        <div class="card">
            <h3> Agenda</h3>
