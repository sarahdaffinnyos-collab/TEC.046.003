<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <div class="card">
                <!-- Cabeçalho e título do RPG -->
                <div class="card-header text-center">
                    Nome do RPG - Criado por Joab
                </div>
                <!-- Tela Central do Jogo -->
                <div class="card-body"
                style="background-image: url('assets/pa.png');
                background-size: cover;">
                    <div class="row">
                        <!-- Status do Herói -->
                        <div class="col">
                            <ul class="list-group float-end text-center" style="width: 225px">
                                <li class="list-group-item">Aerion Targaryen </li>
                                <li class="list-group-item">Resenhudo 😝 </li>
                                <li class="list-group-item">
                                    ❤️
                                    <progress value="100" max="100" style="accent-color: pink;"> </progress> </li>
                                <li class="list-group-item">
                                    🎀
                                    <progress  value="100" max="100" style="accent-color: pink;"> </progress> </li>
                                <li class="list-group-item">
                                    ⚡
                                    <progress  value="67" max="100" style="accent-color: pink;"> </progress> </li>
                            </ul>
                        </div>
                        <!-- Status do Chefe -->
                        <div class="col">
                            <ul class="list-group float-start text-center" style="width: 225px">
                                <li class="list-group-item">Henrique Capeta </li>
                                <li class="list-group-item"> Emo Feio 🥷 </li>
                                <li class="list-group-item">
                                    🖤
                                    <progress value="0" max="100" style="accent-color: green;"></progress> </li>
                                <li class="list-group-item">
                                    🧪
                                    <progress  value="0" max="100" style="accent-color: green;"></progress> </li>
                                <li class="list-group-item">
                                    ⚡
                                    <progress  value="0" max="100" style="accent-color: green;"></progress> </li>
                            </ul>
                        </div>
                    </div> <!-- fim do row -->
                    <div class="row">
                        <!-- IMG HERO -->
                         <div class="col text-end">
                            <img src="assets/ppg.gif" width="400"  height="300"/>
                        </div>
                        <!-- IMG BOSS -->
                         <div class="col">
                            <img src="assets/mojo.gif" width="400"  height="300" />
                         </div>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <small class="tex-muted">Ações do Herói</small>
                    <p> </p>
                    <small class="tex-muted">Açoes do Boss</small>
                </div>
                
            </div> <!-- fechamento do card -->
        </div> <!-- fechamento do container -->
    </body>
</html>
